[build]
# Use Nixpacks for automatic Python detection and dependency installation
builder = "NIXPACKS"

[deploy]
# Streamlit health check endpoint
healthcheckPath = "/_stcore/health"
healthcheckTimeout = 100
startCommand = "streamlit run enhanced_agent_streamlit.py --server.port $PORT --server.address 0.0.0.0 --server.headless true"

# Restart policy
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[services]
# Railway will auto-detect this is a web service from the Procfile
